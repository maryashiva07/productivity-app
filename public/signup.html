<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Signup | Todo Manager</title>

    <link rel="stylesheet" href="auth.css">

</head>


<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                ✓
            </div>

            <p class="small-title">
                PRODUCTIVITY
            </p>

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Start organizing your tasks today.
            </p>


            <form id="signupForm">

                <div class="input-group">

                    <label>Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Create Account
                </button>

            </form>


            <div class="divider">
                <span>OR</span>
            </div>


            <button
                class="google-btn"
                id="googleLogin"
            >
                <span>G</span>
                Continue with Google
            </button>


            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="auth.js"></script>

</body>

</html>
