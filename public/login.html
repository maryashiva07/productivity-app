<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Todo Manager</title>

    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                ✓
            </div>

            <p class="small-title">PRODUCTIVITY</p>

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to manage your personal todos.
            </p>


            <form id="loginForm">

                <div class="input-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Login
                </button>

            </form>


            <div class="divider">
                <span>OR</span>
            </div>


            <p class="auth-footer">

                Don't have an account?

                <a href="signup.html">
                    Create account
                </a>

            </p>

        </div>

    </div>


    <script src="auth.js"></script>

</body>

</html>
